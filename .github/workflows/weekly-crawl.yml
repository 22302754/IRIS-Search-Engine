# IRIS - weekly incremental re-crawl of the shared cloud database.
# Every Monday 05:00 Cyprus time (02:00 UTC), and on demand from the Actions tab ("Run workflow").
# Needs one repository secret: DATABASE_URL = the Supabase session pooler connection string.
# Running weekly also keeps the free Supabase project from pausing after 7 idle days.
name: Weekly crawl

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check and clean the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the repository secret DATABASE_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Accept the value even if it was pasted with DATABASE_URL=, quotes, spaces or a line break.
          url="$(printf '%s' "$DATABASE_URL" | tr -d '"'"'"'[:space:]')"
          url="${url#DATABASE_URL=}"
          case "$url" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::The DATABASE_URL secret must start with postgresql:// - paste only the connection string."; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Back up the database before changing it
        run: python -m infra.backup_db --out backups

      - name: Crawl -> report -> index
        run: python run_pipeline.py

      - name: Data-quality check
        run: python -m infra.check_quality --source db --out docs/data-quality.md

      - name: Summary
        if: always()
        run: |
          if [ -f docs/crawl-report.md ]; then cat docs/crawl-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f docs/data-quality.md ]; then head -n 12 docs/data-quality.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the reports and the backup (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-crawl-${{ github.run_number }}
          path: |
            docs/crawl-report.md
            docs/data-quality.md
            crawler/output/crawl_stats.json
            backups/
          retention-days: 30
          if-no-files-found: warn
