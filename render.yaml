# Render blueprint for the IRIS web app (free plan).
# Render -> New -> Blueprint -> pick this repository. Then set DATABASE_URL in the dashboard.
services:
  - type: web
    name: iris-search
    runtime: python
    plan: free
    region: frankfurt                 # same region as the Supabase database
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    autoDeploy: true                  # every merge into main is deployed
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL             # the Supabase session pooler string, entered in the dashboard
        sync: false
