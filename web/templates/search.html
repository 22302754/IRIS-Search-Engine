<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRIS Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="search-view">
  <header class="site-header">
    <a class="brand-lockup" href="{{ url_for('home') }}" aria-label="IRIS Search Engine home">
      <img class="brand-symbol" src="{{ url_for('static', filename='iris-logo.svg') }}" alt="">
      <span class="brand-copy">
        <span class="brand-name">IRIS</span>
        <span class="brand-descriptor">Search Engine</span>
      </span>
    </a>
  </header>

  <main class="search-page">
    <div class="hero-brand" aria-label="IRIS Search Engine">
      <img class="hero-brand-symbol" src="{{ url_for('static', filename='iris-logo.svg') }}" alt="">
      <h1>IRIS</h1>
    </div>

    <form action="{{ url_for('results') }}" method="get" class="search-form">
      <label class="visually-hidden" for="search-query">Search terms</label>
      <div class="search-control">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search-query" type="search" name="q" placeholder="Search by topic, name, or phrase" autofocus required>
        <label class="visually-hidden" for="search-site">Site</label>
        <select id="search-site" name="site" class="site-select">
          <option value="">All sites</option>
          {% for key, label in sites.items() %}
          <option value="{{ key }}"{% if key == site %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
        <button type="submit">Search <span aria-hidden="true">&rarr;</span></button>
      </div>
    </form>

    <div class="search-footnote">
      <span class="index-status"><span class="status-dot" aria-hidden="true"></span> INDEX READY</span>
      <span>Browse, compare, discover</span>
    </div>
  </main>

  <footer class="site-footer">
    <span>IRIS / SEARCH INDEX</span>
    <span>BUILT FOR CURIOSITY</span>
  </footer>
  <script>
    // Enter in the search box always starts the search, whatever has the focus inside the form.
    document.querySelectorAll("form.search-form").forEach(function (form) {
      form.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.isComposing && event.target.tagName !== "BUTTON") {
          event.preventDefault();
          var box = form.querySelector("input[name=q]");
          if (box && box.value.trim()) { form.submit(); }
        }
      });
    });
  </script>
</body>
</html>
