<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRIS Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="search-page">
    <h1 class="logo">IRIS</h1>
    <p class="tagline">Search the pages we crawled</p>
    <form action="{{ url_for('results') }}" method="get" class="search-form">
      <input type="text" name="q" placeholder="Type your search..." autofocus>
      <button type="submit">Search</button>
    </form>
  </main>
</body>
</html>
